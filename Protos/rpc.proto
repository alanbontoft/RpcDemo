syntax = "proto3";

option csharp_namespace = "RpcDemo";

package rpc;

service TempService {
  rpc Execute (ClientMessage) returns (ServerMessage);
}

enum CommandType
{
    ReadValue = 0;
    SetValue = 1;
    IncreaseValue = 2;
    DecreaseValue = 3;
}

message ClientMessage
{
    oneof payload
    {
        TemperatureRequest tempRequest = 1;
    }
}

message ServerMessage
{
    oneof payload
    {
        TemperatureResponse tempResponse = 1;
        AlarmEvent alarm = 2;
    }
}

message TemperatureRequest {
  CommandType command = 1;
  double value = 2;
  repeated int32 data = 3; /* array data */
}

message TemperatureResponse {
  string message = 1;
  int32 status = 2;
  double value = 3;
}

message AlarmEvent
{
    string text = 1;
}

service EventService
{
    rpc Subscribe(EventSubscription) returns (stream EventMessage);
}

message EventSubscription
{
    repeated string eventTypes = 1;
}

message EventMessage
{
    EventType type = 1;
    string text = 2;
    int64 timestamp = 3;
}

enum EventType
{
    UNKNOWN = 0;
    ALARM = 1;
    STATUS = 2;
    MEASUREMENT_COMPLETE = 3;
}
